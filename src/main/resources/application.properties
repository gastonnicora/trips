spring.application.name=trips

server.port=8080

#Perfiles
spring.profiles.active=dev

#Base de datos
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#Ruteo por caminos reales (OSRM). Por defecto usa el servidor de demo; en produccion conviene uno propio.
routing.osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org}

#logs 
logging.file.name=logs/trips.log









